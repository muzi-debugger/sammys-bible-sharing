name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Partner identities come from repository secrets so the public repo
          # contains no personal email addresses.
          VITE_PARTNER_ONE_NAME: ${{ vars.VITE_PARTNER_ONE_NAME }}
          VITE_PARTNER_ONE_EMAIL: ${{ secrets.VITE_PARTNER_ONE_EMAIL }}
          VITE_PARTNER_TWO_NAME: ${{ vars.VITE_PARTNER_TWO_NAME }}
          VITE_PARTNER_TWO_EMAIL: ${{ secrets.VITE_PARTNER_TWO_EMAIL }}
          # Set VITE_BIBLE_PROVIDER=api-bible as a repository variable once you
          # have NLT access approved on API.Bible.
          VITE_BIBLE_PROVIDER: ${{ vars.VITE_BIBLE_PROVIDER }}
          VITE_API_BIBLE_KEY: ${{ secrets.VITE_API_BIBLE_KEY }}
          VITE_API_BIBLE_ID: ${{ vars.VITE_API_BIBLE_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
